<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --ink:#1B241E; --ink-soft:#4B564D;
    --paper:#F3F1E8; --paper-raised:#FBFAF4;
    --ledger:#16261F;
    --gold:#B98A3D; --gold-soft:#E4CB9A;
    --teal:#3E7C6B; --teal-bg:#E4EEE9;
    --rust:#B5573F; --rust-bg:#F3E4DF;
    --rule:#C9C4B3; --rule-soft:#DEDACB;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; font-size:15px; line-height:1.5;}
  .wrap{max-width:720px; margin:0 auto; padding:0 16px 64px;}
  .num{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;}

  .masthead{background:var(--ledger); color:#EFEAD9; padding:20px 16px; border-radius:0 0 14px 14px;}
  .masthead-inner{max-width:720px; margin:0 auto; display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#B9C4B5; margin:0 0 4px;}
  .household-name{font-family:'Fraunces', serif; font-weight:500; font-size:20px; margin:0; color:#FBFAF4;}
  .stamp{border:1.5px solid var(--gold-soft); color:var(--gold-soft); font-family:'IBM Plex Mono', monospace; font-size:11px; padding:4px 9px; border-radius:3px;}

  .section{margin-top:28px;}
  .col-label{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px 2px;}

  .pill-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; overflow-x:auto;}
  .pill{font-family:'IBM Plex Mono', monospace; font-size:12.5px; background:none; border:1px solid var(--rule); color:var(--ink-soft); padding:7px 14px; border-radius:20px; cursor:pointer; white-space:nowrap;}
  .pill.active{background:var(--ledger); border-color:var(--ledger); color:#FBFAF4;}

  .banner{display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-radius:10px; margin-bottom:14px; font-size:13px;}
  .banner.warn{background:rgba(185,138,61,0.14); color:#7A5A1E;}
  .banner.error{background:var(--rust-bg); color:var(--rust);}
  .banner i{font-size:16px; margin-top:1px; flex-shrink:0;}
  .banner ul{margin:4px 0 0; padding-left:18px;}

  .card{background:var(--paper-raised); border:0.5px solid var(--rule); border-radius:10px; padding:14px 16px; margin-bottom:14px;}
  .card-line{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0;}
  .card-line .val{font-family:'IBM Plex Mono',monospace;}
  .target-row{display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:8px; border-top:0.5px dashed var(--rule);}
  .target-edit{display:flex; align-items:center; gap:6px;}
  .target-edit input{width:56px;}
  .link-btn{background:none; border:none; color:var(--gold); font-size:12px; font-family:'IBM Plex Mono',monospace; cursor:pointer; text-decoration:underline; padding:0;}

  .progress-wrap{margin-top:18px; padding-top:8px;}
  .progress-track{position:relative; height:20px; border-radius:6px; background:var(--rule-soft); margin-top:20px;}
  .progress-fill{position:absolute; top:0; left:0; height:100%; border-radius:6px; transition:width .3s ease;}
  .progress-marker{position:absolute; top:-3px; height:26px; width:0; border-left-width:2px; border-left-style:solid; border-color:var(--ink-soft);}
  .progress-marker.target{border-left-style:dashed; border-left-width:2px; border-color:var(--ledger);}
  .progress-marker.plan{border-left-width:3px; border-color:var(--ink);}
  .progress-marker-label{position:absolute; top:-17px; font-size:10px; font-family:'IBM Plex Mono',monospace; white-space:nowrap; transform:translateX(-50%); color:var(--ink-soft);}
  .progress-marker-label.target{color:var(--ledger); font-weight:600;}
  .progress-caption{margin-top:8px; font-size:13px; font-weight:600;}
  .progress-caption.ok{color:var(--teal);}
  .progress-caption.warn{color:#8A6323;}
  .progress-caption.over{color:var(--rust);}

  input, select{font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; padding:7px 9px; border-radius:6px; border:1px solid var(--rule); background:#fff; color:var(--ink);}
  button.btn{font-family:'IBM Plex Mono',monospace; font-size:12.5px; background:var(--ledger); color:#FBFAF4; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;}
  button.btn.secondary{background:none; border:1px solid var(--rule); color:var(--ink);}
  button.btn:disabled{opacity:0.5; cursor:default;}

  .action-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .action-row button{flex:1; min-width:130px;}

  .form-panel{background:var(--paper-raised); border:0.5px solid var(--rule); border-radius:10px; padding:14px 16px; margin-bottom:14px; display:none;}
  .form-panel.open{display:block;}
  .form-row{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
  .form-row label{font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .form-actions{display:flex; gap:8px; margin-top:4px;}
  .form-msg{font-size:12.5px; margin-top:8px;}
  .form-msg.ok{color:var(--teal);}
  .form-msg.error{color:var(--rust);}

  .table-scroll{overflow-x:auto; border:0.5px solid var(--rule); border-radius:10px; background:var(--paper-raised);}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:440px;}
  thead th{text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); padding:9px 10px; border-bottom:1.5px solid var(--ink); white-space:nowrap;}
  th.num, td.num{text-align:right;}
  tbody td{padding:8px 10px; border-bottom:0.5px solid var(--rule-soft); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}

  tr.subtype-row{cursor:pointer; background:rgba(185,138,61,0.08);}
  tr.subtype-row td{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:#8A6323;}
  tr.category-row td:first-child{padding-left:26px;}
  .hidden{display:none;}
  .chevron{font-size:13px; margin-right:5px; color:var(--ink-soft); transition:transform .15s ease; display:inline-block;}
  .chevron.open{transform:rotate(90deg);}

  .variance{font-size:11px; margin-left:5px;}
  .variance.over{color:var(--rust);}
  .variance.ok{color:var(--teal);}
  .notes-text-cell{font-size:11.5px; color:var(--ink-soft); max-width:160px;}

  tr.total-row td{border-top:2px solid var(--ink); border-bottom:none; font-weight:600; font-size:13.5px;}

  .state-msg{font-size:13px; color:var(--ink-soft); padding:14px 4px; font-style:italic;}
  footer{margin-top:36px; text-align:center; font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <div>
      <p class="eyebrow">Expense control</p>
      <h1 class="household-name" id="householdName">Loading…</h1>
    </div>
    <span class="stamp" id="mastheadStamp"></span>
  </div>
</div>

<div class="wrap">

  <div class="section" style="margin-top:20px;">
    <div class="pill-row" id="monthPills"><p class="state-msg">Loading months…</p></div>

    <div id="specialCategoryBanner"></div>
    <div id="exceptionsBanner"></div>

    <div class="card" id="targetCard"><p class="state-msg">Loading…</p></div>

    <div class="action-row">
      <button class="btn secondary" id="btnAddPlanned"><i class="ti ti-plus"></i> Add planned</button>
      <button class="btn secondary" id="btnLogSpend"><i class="ti ti-plus"></i> Log spend</button>
      <button class="btn secondary" id="btnCopyMonth"><i class="ti ti-copy"></i> Copy prev. month</button>
    </div>

    <!-- Add Planned form -->
    <div class="form-panel" id="formAddPlanned">
      <div class="form-row">
        <label>Category</label>
        <select id="fapCategory"></select>
      </div>
      <div class="form-row">
        <label>Estimated amount (₹)</label>
        <input type="number" id="fapAmount" placeholder="e.g. 14000">
      </div>
      <div class="form-row">
        <label>Notes (optional)</label>
        <input type="text" id="fapNotes" placeholder="e.g. covers half-yearly amount">
      </div>
      <div class="form-actions">
        <button class="btn" id="fapSave">Save</button>
        <button class="btn secondary" id="fapCancel">Cancel</button>
      </div>
      <p class="form-msg" id="fapMsg"></p>
    </div>

    <!-- Log Spend form -->
    <div class="form-panel" id="formLogSpend">
      <div class="form-row">
        <label>Category</label>
        <select id="flsCategory"></select>
      </div>
      <div class="form-row">
        <label>Amount spent (₹)</label>
        <input type="number" id="flsAmount" placeholder="e.g. 850">
      </div>
      <div class="form-row">
        <label>Note (optional)</label>
        <input type="text" id="flsNote" placeholder="e.g. coffee run">
      </div>
      <div class="form-actions">
        <button class="btn" id="flsSave">Add to actual</button>
        <button class="btn secondary" id="flsCancel">Cancel</button>
      </div>
      <p class="form-msg" id="flsMsg"></p>
    </div>

    <!-- Copy Month form -->
    <div class="form-panel" id="formCopyMonth">
      <p style="font-size:13px; margin:0 0 10px;">Copy every planned category and amount from the previous month into <span id="copyTargetLabel"></span>. Actual amounts start blank. Existing categories already planned this month are left untouched.</p>
      <div class="form-actions">
        <button class="btn" id="fcmSave">Copy now</button>
        <button class="btn secondary" id="fcmCancel">Cancel</button>
      </div>
      <p class="form-msg" id="fcmMsg"></p>
    </div>

    <p class="col-label">Expenses</p>
    <div id="expenseTableWrap"><p class="state-msg">Loading…</p></div>
  </div>

  <footer>Data from the household Google Sheet, via Apps Script</footer>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyogz2z2P1zmfrl7McdjQIRA1I0Dczrvlr_1tpOxDCMK84DrXuaPmBO0TORkOetTtZ0qQ/exec';

const fmt = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');

async function apiGet(action, params={}) {
  const qs = new URLSearchParams({ action, ...params }).toString();
  const res = await fetch(`${APPS_SCRIPT_URL}?${qs}`);
  if (!res.ok) throw new Error('Request failed: ' + action);
  return res.json();
}
// text/plain avoids a CORS preflight against the Apps Script web app
async function apiPost(body) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  return res.json();
}

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return `${MONTH_NAMES[m-1]} ${y}`;
}
function prevMonthKey(key){
  let [y,m] = key.split('-').map(Number);
  m -= 1; if (m < 1){ m = 12; y -= 1; }
  return y + '-' + String(m).padStart(2,'0');
}

let months = [];
let currentMonth = '';
let selectedMonth = '';
let outflowCategories = [];

/* ============================================================
 * MONTH PILLS
 * ============================================================ */
function renderMonthPills(){
  document.getElementById('monthPills').innerHTML = months.map(m => `
    <button class="pill ${m===selectedMonth?'active':''}" data-month="${m}">${monthLabel(m)}${m===currentMonth?' · current':''}</button>`).join('');
  document.querySelectorAll('#monthPills .pill').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      selectedMonth = btn.dataset.month;
      document.querySelectorAll('#monthPills .pill').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      closeAllForms();
      await loadAndRenderExpenses();
    });
  });
}

/* ============================================================
 * LOAD + RENDER EXPENSE DATA
 * ============================================================ */
let currentData = null;

async function loadAndRenderExpenses(){
  document.getElementById('targetCard').innerHTML = `<p class="state-msg">Loading…</p>`;
  document.getElementById('expenseTableWrap').innerHTML = `<p class="state-msg">Loading…</p>`;
  try {
    currentData = await apiGet('expenses', { month: selectedMonth });
  } catch (err){
    document.getElementById('expenseTableWrap').innerHTML = `<p class="state-msg">Couldn't load data — check the Apps Script URL and deployment.</p>`;
    return;
  }
  document.getElementById('mastheadStamp').textContent = monthLabel(currentData.month) + (currentData.isCurrent ? ' · in progress' : '');
  renderSpecialCategoryBanner(currentData.specialCategoryIssues);
  // Exceptions banner hidden for now — data still computed server-side (currentData.exceptions),
  // just not rendered. Uncomment to bring back: renderExceptionsBanner(currentData.exceptions);
  document.getElementById('exceptionsBanner').innerHTML = '';
  renderTargetCard(currentData);
  renderExpenseTable(currentData);
}

function renderSpecialCategoryBanner(missing){
  const el = document.getElementById('specialCategoryBanner');
  if (!missing || !missing.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="banner error"><i class="ti ti-alert-circle"></i>
    <div>Special outflow categories missing from the Categories sheet: <strong>${missing.join(', ')}</strong>. Add them there, or update "Special Outflow Categories" in Config.</div></div>`;
}

function renderExceptionsBanner(exceptions){
  const el = document.getElementById('exceptionsBanner');
  if (!exceptions || !exceptions.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="banner warn"><i class="ti ti-alert-triangle"></i>
    <div>${exceptions.length} exception${exceptions.length>1?'s':''} vs last month's actual:
      <ul>${exceptions.map(x => `<li>${x.category}: ${fmt(x.prevActual)} last month → ${fmt(x.thisEstimate)} estimated this month</li>`).join('')}</ul>
    </div></div>`;
}

function renderTargetCard(data){
  const card = document.getElementById('targetCard');
  const { estTotal, actTotal, targetPct, targetActual } = data;
  const pctOfEst = estTotal ? (actTotal / estTotal * 100) : 0;

  // Dynamic scale: if actual exceeds estimate, stretch the track with headroom
  // so the plan line visibly shifts left instead of the fill being clipped.
  const overEstimate = actTotal > estTotal;
  const scale = overEstimate ? actTotal * 1.08 : (estTotal || 1);
  const planPos = Math.min(100, (estTotal / scale) * 100);
  const targetPos = (targetPct !== null) ? (targetActual / scale) * 100 : null;
  const fillPos = Math.min(100, (actTotal / scale) * 100);

  let zone, captionText;
  if (targetPct !== null){
    if (actTotal <= targetActual){ zone = 'ok'; captionText = `${fmt(targetActual - actTotal)} under target`; }
    else if (actTotal <= estTotal){ zone = 'warn'; captionText = `${fmt(actTotal - targetActual)} over target, within plan`; }
    else { zone = 'over'; captionText = `${fmt(actTotal - estTotal)} over plan`; }
  } else {
    if (actTotal <= estTotal){ zone = 'ok'; captionText = `${fmt(estTotal - actTotal)} under estimate`; }
    else { zone = 'over'; captionText = `${fmt(actTotal - estTotal)} over estimate`; }
  }
  const zoneColorMap = { ok: 'var(--teal)', warn: 'var(--gold)', over: 'var(--rust)' };

  card.innerHTML = `
    <div class="card-line"><span>Estimate total</span><span class="val">${fmt(estTotal)}</span></div>
    <div class="card-line"><span>Actual so far</span><span class="val">${fmt(actTotal)}</span></div>
    <div class="target-row">
      <span style="font-size:13px;">Target reduction</span>
      <span>
        ${targetPct !== null ? `<span class="num" style="font-weight:600;">${targetPct}%</span>` : `<span style="color:var(--ink-soft); font-size:12.5px;">not set</span>`}
        <button class="link-btn" id="btnEditTarget" style="margin-left:8px;">edit</button>
      </span>
    </div>
    <div id="targetEditRow" style="display:none; margin-top:8px;">
      <div class="target-edit">
        <input type="number" id="targetPctInput" value="${targetPct !== null ? targetPct : ''}" step="0.5">
        <span style="font-size:12.5px;">%</span>
        <button class="btn" id="targetSaveBtn" style="padding:6px 10px;">Save</button>
      </div>
      <p class="form-msg" id="targetMsg"></p>
    </div>
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" style="width:${fillPos}%; background:${zoneColorMap[zone]};"></div>
        ${targetPos !== null ? `<div class="progress-marker target" style="left:${targetPos}%;"></div>` : ''}
        <div class="progress-marker plan" style="left:${planPos}%;"></div>
      </div>
      <p class="progress-caption ${zone}">${captionText}</p>
    </div>`;

  document.getElementById('btnEditTarget').addEventListener('click', ()=>{
    document.getElementById('targetEditRow').style.display = 'block';
  });
  document.getElementById('targetSaveBtn').addEventListener('click', async ()=>{
    const val = document.getElementById('targetPctInput').value;
    const msg = document.getElementById('targetMsg');
    if (val === '' || isNaN(val)){ msg.textContent = 'Enter a number.'; msg.className = 'form-msg error'; return; }
    msg.textContent = 'Saving…'; msg.className = 'form-msg';
    try {
      await apiPost({ action:'setTarget', month: selectedMonth, targetPct: Number(val) });
      await loadAndRenderExpenses();
    } catch(err){
      msg.textContent = 'Could not save.'; msg.className = 'form-msg error';
    }
  });
}

/* ============================================================
 * EXPENSE TABLE — Subtype > Category accordion
 * ============================================================ */
function renderExpenseTable(data){
  const wrap = document.getElementById('expenseTableWrap');
  if (!data.categories.length){
    wrap.innerHTML = `<p class="state-msg">No expenses planned for this month yet — use "Add planned" above.</p>`;
    return;
  }

  const subtypeOrder = [];
  const groups = {};
  data.categories.forEach(c => {
    const st = c.subtype || 'Other';
    if (!groups[st]){ groups[st] = []; subtypeOrder.push(st); }
    groups[st].push(c);
  });

  const grandEstTotal = data.estTotal;

  let bodyRows = '';
  subtypeOrder.forEach((st, i) => {
    const cats = groups[st].slice().sort((a,b) => b.actualAmount - a.actualAmount);
    const stEst = cats.reduce((s,c)=>s+c.estAmount,0);
    const stAct = cats.reduce((s,c)=>s+c.actualAmount,0);
    const stPct = grandEstTotal ? (stEst/grandEstTotal*100) : 0;
    const stDiff = stEst - stAct;

    bodyRows += `
      <tr class="subtype-row" id="st-${i}">
        <td><i class="ti ti-chevron-right chevron"></i>${st}</td>
        <td class="num">${fmt(stEst)} <span style="font-weight:400; opacity:0.75;">(${stPct.toFixed(0)}%)</span></td>
        <td class="num">${fmt(stAct)}</td>
        <td class="num" style="color:${stDiff<0?'var(--rust)':'inherit'};">${fmt(stDiff)}</td>
        <td></td>
      </tr>`;

    cats.forEach((c, j) => {
      const pctOfTotal = grandEstTotal ? (c.estAmount/grandEstTotal*100) : 0;
      const diff = c.estAmount - c.actualAmount;
      bodyRows += `
        <tr class="category-row hidden cat-under-st-${i}" id="cat-${i}-${j}">
          <td>${c.category}</td>
          <td class="num">${fmt(c.estAmount)} <span style="color:var(--ink-soft);">(${pctOfTotal.toFixed(0)}%)</span></td>
          <td class="num">${fmt(c.actualAmount)}</td>
          <td class="num" style="color:${diff<0?'var(--rust)':'var(--teal)'};">${fmt(diff)}</td>
          <td class="notes-text-cell">${c.notes || ''}</td>
        </tr>`;
    });
  });

  bodyRows += `
    <tr class="total-row">
      <td>Total</td><td class="num">${fmt(grandEstTotal)}</td><td class="num">${fmt(data.actTotal)}</td><td class="num">${fmt(grandEstTotal - data.actTotal)}</td><td></td>
    </tr>`;

  wrap.innerHTML = `<div class="table-scroll"><table>
    <thead><tr><th>Category</th><th class="num">Est</th><th class="num">Actual</th><th class="num">Difference</th><th>Notes</th></tr></thead>
    <tbody>${bodyRows}</tbody>
  </table></div>`;

  subtypeOrder.forEach((st, i) => {
    const stRow = document.getElementById(`st-${i}`);
    stRow.addEventListener('click', () => {
      const chevron = stRow.querySelector('.chevron');
      const willOpen = !chevron.classList.contains('open');
      chevron.classList.toggle('open', willOpen);
      document.querySelectorAll(`.cat-under-st-${i}`).forEach(row => row.classList.toggle('hidden', !willOpen));
    });
  });
}

/* ============================================================
 * ADD PLANNED / LOG SPEND / COPY MONTH — forms
 * ============================================================ */
function closeAllForms(){
  ['formAddPlanned','formLogSpend','formCopyMonth'].forEach(id => document.getElementById(id).classList.remove('open'));
}

async function ensureCategoryOptions(){
  if (outflowCategories.length) return;
  try { outflowCategories = await apiGet('categories'); } catch(err){ outflowCategories = []; }
}

function populateCategorySelect(selectEl){
  selectEl.innerHTML = outflowCategories.map(c => `<option value="${c.category}">${c.category} (${c.subtype})</option>`).join('');
}

document.getElementById('btnAddPlanned').addEventListener('click', async ()=>{
  closeAllForms();
  await ensureCategoryOptions();
  populateCategorySelect(document.getElementById('fapCategory'));
  document.getElementById('fapAmount').value = '';
  document.getElementById('fapNotes').value = '';
  document.getElementById('fapMsg').textContent = '';
  document.getElementById('formAddPlanned').classList.add('open');
});
document.getElementById('fapCancel').addEventListener('click', closeAllForms);
document.getElementById('fapSave').addEventListener('click', async ()=>{
  const category = document.getElementById('fapCategory').value;
  const amount = document.getElementById('fapAmount').value;
  const notes = document.getElementById('fapNotes').value;
  const msg = document.getElementById('fapMsg');
  if (!category){ msg.textContent = 'Choose a category.'; msg.className = 'form-msg error'; return; }
  if (amount === '' || isNaN(amount) || Number(amount) < 0){ msg.textContent = 'Enter a valid amount.'; msg.className = 'form-msg error'; return; }
  msg.textContent = 'Saving…'; msg.className = 'form-msg';
  try {
    await apiPost({ action:'addPlanned', month: selectedMonth, category, estAmount: Number(amount), notes });
    msg.textContent = 'Saved.'; msg.className = 'form-msg ok';
    await loadAndRenderExpenses();
    setTimeout(closeAllForms, 600);
  } catch(err){
    msg.textContent = 'Could not save.'; msg.className = 'form-msg error';
  }
});

document.getElementById('btnLogSpend').addEventListener('click', async ()=>{
  closeAllForms();
  await ensureCategoryOptions();
  populateCategorySelect(document.getElementById('flsCategory'));
  document.getElementById('flsAmount').value = '';
  document.getElementById('flsNote').value = '';
  document.getElementById('flsMsg').textContent = '';
  document.getElementById('formLogSpend').classList.add('open');
});
document.getElementById('flsCancel').addEventListener('click', closeAllForms);
document.getElementById('flsSave').addEventListener('click', async ()=>{
  const category = document.getElementById('flsCategory').value;
  const amount = document.getElementById('flsAmount').value;
  const note = document.getElementById('flsNote').value;
  const msg = document.getElementById('flsMsg');
  if (!category){ msg.textContent = 'Choose a category.'; msg.className = 'form-msg error'; return; }
  if (amount === '' || isNaN(amount) || Number(amount) <= 0){ msg.textContent = 'Enter a valid amount.'; msg.className = 'form-msg error'; return; }
  msg.textContent = 'Saving…'; msg.className = 'form-msg';
  try {
    await apiPost({ action:'logSpend', month: selectedMonth, category, amount: Number(amount), note });
    msg.textContent = 'Added.'; msg.className = 'form-msg ok';
    await loadAndRenderExpenses();
    setTimeout(closeAllForms, 600);
  } catch(err){
    msg.textContent = 'Could not save.'; msg.className = 'form-msg error';
  }
});

document.getElementById('btnCopyMonth').addEventListener('click', ()=>{
  closeAllForms();
  document.getElementById('copyTargetLabel').textContent = monthLabel(selectedMonth);
  document.getElementById('fcmMsg').textContent = '';
  document.getElementById('formCopyMonth').classList.add('open');
});
document.getElementById('fcmCancel').addEventListener('click', closeAllForms);
document.getElementById('fcmSave').addEventListener('click', async ()=>{
  const msg = document.getElementById('fcmMsg');
  msg.textContent = 'Copying…'; msg.className = 'form-msg';
  try {
    const res = await apiPost({ action:'copyMonth', fromMonth: prevMonthKey(selectedMonth), toMonth: selectedMonth });
    msg.textContent = `Copied ${res.copied} categor${res.copied===1?'y':'ies'}.`; msg.className = 'form-msg ok';
    await loadAndRenderExpenses();
    setTimeout(closeAllForms, 900);
  } catch(err){
    msg.textContent = 'Could not copy.'; msg.className = 'form-msg error';
  }
});

/* ============================================================
 * META
 * ============================================================ */
async function loadMeta(){
  try {
    const { householdName } = await apiGet('meta');
    document.getElementById('householdName').textContent = householdName;
  } catch (err){
    document.getElementById('householdName').textContent = 'Household Ledger';
  }
}

/* ============================================================
 * INIT
 * ============================================================ */
(async function init(){
  loadMeta();
  try {
    const res = await apiGet('months');
    months = res.months;
    currentMonth = res.currentMonth;
    selectedMonth = currentMonth;
  } catch (err){
    document.getElementById('monthPills').innerHTML = `<p class="state-msg">Couldn't load month range — check the Apps Script URL and deployment.</p>`;
    return;
  }
  renderMonthPills();
  loadAndRenderExpenses();
})();
</script>
